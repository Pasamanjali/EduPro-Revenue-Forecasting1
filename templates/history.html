<!DOCTYPE html>
<html>
<head>
    <title>Prediction History</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>
<body>

<div class="container">

<h1>Prediction History</h1>

<table border="1" width="20%" cellpadding="10">

<tr>
    <th>ID</th>
    <th>Category</th>
    <th>Price</th>
    <th>Rating</th>
    <th>Duration</th>
    <th>Marketing</th>
    <th>Students</th>
    <th>Revenue</th>
</tr>

{% for row in records %}

<tr>

<td>{{ row[0] }}</td>
<td>{{ row[1] }}</td>
<td>{{ row[2] }}</td>
<td>{{ row[3] }}</td>
<td>{{ row[4] }}</td>
<td>{{ row[5] }}</td>
<td>{{ row[6] }}</td>
<td>₹ {{ row[7] }}</td>

</tr>

{% endfor %}

</table>

<br>

<a href="/">← Back to Prediction</a>

</div>

</body>
</html>
