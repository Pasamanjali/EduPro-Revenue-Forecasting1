<!DOCTYPE html>
<html>

<head>

<title>Prediction Result</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="container">

<h1>Prediction Result</h1>

<div class="result-card">


<h2>Predicted Students</h2>

<h1>{{ prediction }}</h1>

<h2>Estimated Revenue</h2>

<h1>₹ {{ revenue }}</h1>
<h2>Revenue Chart</h2>

<img src="{{ url_for('static', filename='images/chart1.png') }}"
     alt="Revenue Chart"
     width="700">

<h2>Demand Level</h2>

<h3>{{ demand }}</h3>

</div>

<br>

<a href="/">

    <button>
        Predicted Again
    </button>
</a>


</div>

</body>

</html>
